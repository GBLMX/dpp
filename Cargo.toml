[workspace]
members = ["crates/dpp-cli", "crates/dpp-core", "crates/dpp-modrinth", "crates/dpp-ops"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
fastnbt = "2.6"
flate2 = "1.0"
predicates = "3.1"
pubgrub = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
